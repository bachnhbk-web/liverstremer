<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trọng Tài Pickleball — Bấm Điểm Đồng Bộ Live</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col p-3 max-w-md mx-auto gap-3">

  <!-- Header & Room Connection -->
  <header class="rounded-2xl bg-zinc-900 border border-zinc-800 p-3 flex items-center justify-between gap-2">
    <div>
      <h1 class="text-sm font-extrabold text-white tracking-tight">TRỌNG TÀI PICKLEBALL</h1>
      <div class="flex items-center gap-1.5 text-[11px] mt-0.5">
        <span id="connDot" class="w-2 h-2 rounded-full bg-amber-400"></span>
        <span id="connText" class="text-zinc-400">Đang kết nối...</span>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <input id="roomInput" type="text" value="SAN-1" class="w-20 px-2.5 py-1.5 rounded-lg bg-zinc-950 border border-zinc-700 text-xs font-bold text-center uppercase text-amber-400 focus:outline-none focus:border-amber-500" />
      <button id="btnJoinRoom" type="button" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-xs font-bold text-white active:scale-95 transition">Vào Sân</button>
    </div>
  </header>

  <!-- Match Category -->
  <div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-3 space-y-2">
    <label class="block text-[11px] font-semibold text-zinc-400">Nội dung / Vòng đấu</label>
    <input id="categoryInput" type="text" value="Đôi Nam · Chung Kết" class="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-xs font-semibold text-white focus:outline-none focus:border-emerald-500" />
  </div>

  <!-- Scoreboard Control Cards -->
  <div class="grid grid-cols-2 gap-3 flex-1">
    <!-- TEAM 1 -->
    <div class="rounded-2xl bg-zinc-900 border-2 border-emerald-500/40 p-3 flex flex-col justify-between gap-2.5">
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-400">ĐỘI 1</span>
          <span id="serveBadge1" class="px-2 py-0.5 rounded-full bg-amber-500 text-zinc-950 text-[10px] font-black">GIAO BÓNG</span>
        </div>
        <input id="team1Input" type="text" value="Bách / Nam" class="w-full px-2.5 py-1.5 rounded-lg bg-zinc-950 border border-zinc-800 text-xs font-bold text-white focus:outline-none focus:border-emerald-500" />
      </div>

      <div class="text-center py-2">
        <div id="score1Display" class="text-6xl font-black tabular-nums text-white leading-none">0</div>
        <div class="mt-2 flex items-center justify-center gap-1.5">
          <span class="text-[11px] text-zinc-400">Set:</span>
          <button id="btnSet1Minus" type="button" class="w-6 h-6 rounded bg-zinc-800 text-xs font-bold">-</button>
          <span id="set1Display" class="text-sm font-extrabold text-emerald-400 w-5 text-center tabular-nums">0</span>
          <button id="btnSet1Plus" type="button" class="w-6 h-6 rounded bg-zinc-800 text-xs font-bold">+</button>
        </div>
      </div>

      <div class="space-y-2">
        <button id="btnPoint1Plus" type="button" class="w-full py-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-2xl font-black text-white shadow-lg shadow-emerald-950/50 transition">+1</button>
        <div class="grid grid-cols-2 gap-1.5">
          <button id="btnPoint1Minus" type="button" class="py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-xs font-bold text-zinc-300">-1 Điểm</button>
          <button id="btnServe1" type="button" class="py-2 rounded-xl bg-amber-500/20 border border-amber-500/40 active:scale-95 text-xs font-bold text-amber-300">Giao Bóng</button>
        </div>
      </div>
    </div>

    <!-- TEAM 2 -->
    <div class="rounded-2xl bg-zinc-900 border-2 border-sky-500/40 p-3 flex flex-col justify-between gap-2.5">
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[10px] font-extrabold uppercase tracking-wider text-sky-400">ĐỘI 2</span>
          <span id="serveBadge2" class="hidden px-2 py-0.5 rounded-full bg-amber-500 text-zinc-950 text-[10px] font-black">GIAO BÓNG</span>
        </div>
        <input id="team2Input" type="text" value="Tuấn / Hùng" class="w-full px-2.5 py-1.5 rounded-lg bg-zinc-950 border border-zinc-800 text-xs font-bold text-white focus:outline-none focus:border-sky-500" />
      </div>

      <div class="text-center py-2">
        <div id="score2Display" class="text-6xl font-black tabular-nums text-white leading-none">0</div>
        <div class="mt-2 flex items-center justify-center gap-1.5">
          <span class="text-[11px] text-zinc-400">Set:</span>
          <button id="btnSet2Minus" type="button" class="w-6 h-6 rounded bg-zinc-800 text-xs font-bold">-</button>
          <span id="set2Display" class="text-sm font-extrabold text-sky-400 w-5 text-center tabular-nums">0</span>
          <button id="btnSet2Plus" type="button" class="w-6 h-6 rounded bg-zinc-800 text-xs font-bold">+</button>
        </div>
      </div>

      <div class="space-y-2">
        <button id="btnPoint2Plus" type="button" class="w-full py-4 rounded-xl bg-sky-600 hover:bg-sky-500 active:scale-95 text-2xl font-black text-white shadow-lg shadow-sky-950/50 transition">+1</button>
        <div class="grid grid-cols-2 gap-1.5">
          <button id="btnPoint2Minus" type="button" class="py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-xs font-bold text-zinc-300">-1 Điểm</button>
          <button id="btnServe2" type="button" class="py-2 rounded-xl bg-amber-500/20 border border-amber-500/40 active:scale-95 text-xs font-bold text-amber-300">Giao Bóng</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Server Hand (TAY 1 / TAY 2) & Quick Actions -->
  <div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-3 space-y-2.5">
    <div class="flex items-center justify-between gap-2">
      <span class="text-xs font-bold text-zinc-300">Lượt tay giao bóng:</span>
      <div class="grid grid-cols-2 gap-1.5 w-44">
        <button id="btnHand1" type="button" class="py-2 rounded-xl bg-amber-500 text-zinc-950 text-xs font-black transition">TAY 1</button>
        <button id="btnHand2" type="button" class="py-2 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-black transition">TAY 2</button>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-zinc-800">
      <button id="btnSwapSides" type="button" class="py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-xs font-bold text-zinc-200">Đổi Sân (Trái ↔ Phải)</button>
      <button id="btnResetScore" type="button" class="py-2.5 rounded-xl bg-rose-600/20 border border-rose-500/40 hover:bg-rose-600/30 active:scale-95 text-xs font-bold text-rose-300">Về 0 - 0</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const initialRoom = (params.get('room') || 'SAN-1').toUpperCase();

      const state = {
        roomId: initialRoom,
        category: 'Đôi Nam · Chung Kết',
        team1: 'Bách / Nam',
        team2: 'Tuấn / Hùng',
        score1: 0,
        score2: 0,
        set1: 0,
        set2: 0,
        servingTeam: 1,
        serverHand: 2 // Bắt đầu trận 0-0-2
      };

      const els = {
        connDot: document.getElementById('connDot'),
        connText: document.getElementById('connText'),
        roomInput: document.getElementById('roomInput'),
        btnJoinRoom: document.getElementById('btnJoinRoom'),
        categoryInput: document.getElementById('categoryInput'),
        team1Input: document.getElementById('team1Input'),
        team2Input: document.getElementById('team2Input'),
        score1Display: document.getElementById('score1Display'),
        score2Display: document.getElementById('score2Display'),
        set1Display: document.getElementById('set1Display'),
        set2Display: document.getElementById('set2Display'),
        serveBadge1: document.getElementById('serveBadge1'),
        serveBadge2: document.getElementById('serveBadge2'),
        btnHand1: document.getElementById('btnHand1'),
        btnHand2: document.getElementById('btnHand2')
      };

      els.roomInput.value = state.roomId;
      let ws = null;

      function render() {
        els.categoryInput.value = state.category;
        els.team1Input.value = state.team1;
        els.team2Input.value = state.team2;
        els.score1Display.textContent = state.score1;
        els.score2Display.textContent = state.score2;
        els.set1Display.textContent = state.set1;
        els.set2Display.textContent = state.set2;
        els.serveBadge1.classList.toggle('hidden', state.servingTeam !== 1);
        els.serveBadge2.classList.toggle('hidden', state.servingTeam !== 2);

        if (state.serverHand === 1) {
          els.btnHand1.className = 'py-2 rounded-xl bg-amber-500 text-zinc-950 text-xs font-black transition';
          els.btnHand2.className = 'py-2 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-black transition';
        } else {
          els.btnHand1.className = 'py-2 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-black transition';
          els.btnHand2.className = 'py-2 rounded-xl bg-amber-500 text-zinc-950 text-xs font-black transition';
        }
      }

      function pushUpdate() {
        render();
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'score_update',
            roomId: state.roomId,
            state: {
              category: state.category,
              team1: state.team1,
              team2: state.team2,
              score1: state.score1,
              score2: state.score2,
              set1: state.set1,
              set2: state.set2,
              servingTeam: state.servingTeam,
              serverHand: state.serverHand
            }
          }));
        }
      }

      function connect() {
        if (ws) {
          try { ws.close(); } catch (e) {}
        }
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const url = `${proto}//${location.host}`;
        els.connDot.className = 'w-2 h-2 rounded-full bg-amber-400';
        els.connText.textContent = `Đang nối phòng ${state.roomId}...`;

        ws = new WebSocket(url);
        ws.onopen = () => {
          els.connDot.className = 'w-2 h-2 rounded-full bg-emerald-500';
          els.connText.textContent = `Đã nối phòng ${state.roomId}`;
          ws.send(JSON.stringify({ type: 'join_room', roomId: state.roomId }));
        };
        ws.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'score_sync' && msg.state) {
              Object.assign(state, msg.state);
              render();
            }
          } catch (e) {}
        };
        ws.onclose = () => {
          els.connDot.className = 'w-2 h-2 rounded-full bg-rose-500';
          els.connText.textContent = 'Mất kết nối — tự nối lại...';
          setTimeout(connect, 2500);
        };
      }

      els.btnJoinRoom.addEventListener('click', () => {
        state.roomId = (els.roomInput.value || 'SAN-1').trim().toUpperCase();
        els.roomInput.value = state.roomId;
        connect();
      });

      els.categoryInput.addEventListener('input', () => { state.category = els.categoryInput.value; pushUpdate(); });
      els.team1Input.addEventListener('input', () => { state.team1 = els.team1Input.value; pushUpdate(); });
      els.team2Input.addEventListener('input', () => { state.team2 = els.team2Input.value; pushUpdate(); });

      document.getElementById('btnPoint1Plus').addEventListener('click', () => { state.score1++; state.servingTeam = 1; pushUpdate(); });
      document.getElementById('btnPoint1Minus').addEventListener('click', () => { state.score1 = Math.max(0, state.score1 - 1); pushUpdate(); });
      document.getElementById('btnPoint2Plus').addEventListener('click', () => { state.score2++; state.servingTeam = 2; pushUpdate(); });
      document.getElementById('btnPoint2Minus').addEventListener('click', () => { state.score2 = Math.max(0, state.score2 - 1); pushUpdate(); });

      document.getElementById('btnSet1Plus').addEventListener('click', () => { state.set1++; pushUpdate(); });
      document.getElementById('btnSet1Minus').addEventListener('click', () => { state.set1 = Math.max(0, state.set1 - 1); pushUpdate(); });
      document.getElementById('btnSet2Plus').addEventListener('click', () => { state.set2++; pushUpdate(); });
      document.getElementById('btnSet2Minus').addEventListener('click', () => { state.set2 = Math.max(0, state.set2 - 1); pushUpdate(); });

      document.getElementById('btnServe1').addEventListener('click', () => { state.servingTeam = 1; pushUpdate(); });
      document.getElementById('btnServe2').addEventListener('click', () => { state.servingTeam = 2; pushUpdate(); });
      els.btnHand1.addEventListener('click', () => { state.serverHand = 1; pushUpdate(); });
      els.btnHand2.addEventListener('click', () => { state.serverHand = 2; pushUpdate(); });

      document.getElementById('btnSwapSides').addEventListener('click', () => {
        [state.team1, state.team2] = [state.team2, state.team1];
        [state.score1, state.score2] = [state.score2, state.score1];
        [state.set1, state.set2] = [state.set2, state.set1];
        state.servingTeam = state.servingTeam === 1 ? 2 : 1;
        pushUpdate();
      });

      document.getElementById('btnResetScore').addEventListener('click', () => {
        state.score1 = 0;
        state.score2 = 0;
        state.servingTeam = 1;
        state.serverHand = 2;
        pushUpdate();
      });

      render();
      connect();
    })();
  </script>
</body>
</html>
